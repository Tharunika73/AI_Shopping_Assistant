# Render deployment configuration
services:
  - type: web
    name: ai-shopping-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --lifespan off
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: shopping_ai_db
      - key: CORS_ORIGINS
        value: '*'
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  - type: web
    name: ai-shopping-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: ai-shopping-backend
          property: host
      - key: WDS_SOCKET_PORT
        value: '443'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html